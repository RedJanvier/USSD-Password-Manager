services:
  - type: web
    name: ussd-password-manager
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ussd-password-manager-db
          property: connectionString
      - key: APP_PEPPER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SHORTCODE
        sync: false
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: ussd-password-manager-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
